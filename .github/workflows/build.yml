name: Build and Test

# NOTE: This workflow handles development builds and testing.
# For releases, use the GoReleaser workflow (.github/workflows/goreleaser.yml)
# which provides automated cross-platform builds, package management,
# and professional release asset creation.

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run nightly builds to catch dependency issues
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests for emergency builds'
        required: false
        default: false
        type: boolean

env:
  GO_VERSION: '1.25'
  CGO_ENABLED: 0

jobs:
  # Quality checks and linting
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.cache/golangci-lint
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}-${{ hashFiles('.golangci.yml') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}-
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Check Go formatting
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "❌ Code is not formatted properly:"
            gofmt -s -l .
            echo "Run 'make fmt' to fix formatting issues"
            exit 1
          fi
          echo "✅ Code is properly formatted"

      - name: Run go vet
        run: go vet ./...

      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Run golangci-lint
        run: golangci-lint run --timeout=5m --issues-exit-code=1

      - name: Check for license headers
        run: |
          # Check if all Go files have license headers
          if grep -L "Apache License" $(find . -name "*.go" -not -path "./vendor/*" -not -path "./.git/*"); then
            echo "❌ Some Go files are missing license headers"
            exit 1
          fi
          echo "✅ All Go files have license headers"

  # Comprehensive testing
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    if: ${{ !inputs.skip_tests }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ['1.25', '1.26'] # Test multiple Go versions
    
    permissions:
      contents: read
      checks: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.go-version }}-
            ${{ runner.os }}-go-

      - name: Install build dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config

      - name: Build ms-sys submodule
        if: matrix.os != 'windows-latest'
        run: |
          if [ -d "ms-sys" ]; then
            echo "Building ms-sys submodule..."
            make build-ms-sys || echo "⚠️ ms-sys build failed, continuing without it"
          else
            echo "⚠️ ms-sys submodule not found"
          fi

      - name: Run unit tests
        run: |
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Run integration tests
        run: |
          go test -v -tags=integration ./... || echo "⚠️ Integration tests failed or not available"

      - name: Generate coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.go-version == env.GO_VERSION
        run: |
          go tool cover -html=coverage.out -o coverage.html

      - name: Upload coverage reports
        if: matrix.os == 'ubuntu-latest' && matrix.go-version == env.GO_VERSION
        uses: codecov/codecov-action@v5
        with:
          file: ./coverage.out
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}-go${{ matrix.go-version }}
          path: |
            coverage.out
            coverage.html
          retention-days: 7

  # Multi-architecture builds
  build:
    name: Build Binaries
    needs: [quality, test]
    if: always() && (needs.quality.result == 'success' && (needs.test.result == 'success' || inputs.skip_tests))
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            suffix: linux-amd64
            native: true
          - runner: ubuntu-latest
            goos: linux
            goarch: arm64
            suffix: linux-arm64
            native: false
          # macOS builds
          - runner: macos-latest
            goos: darwin
            goarch: amd64
            suffix: darwin-amd64
            native: true
          - runner: macos-latest
            goos: darwin
            goarch: arm64
            suffix: darwin-arm64
            native: false
          # Windows builds
          - runner: windows-latest
            goos: windows
            goarch: amd64
            suffix: windows-amd64.exe
            native: true
    
    permissions:
      contents: read
      attestations: write
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-build-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-build-

      - name: Install build dependencies (Linux)
        if: matrix.runner == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config gcc-aarch64-linux-gnu

      - name: Build ms-sys (Unix only)
        if: matrix.runner != 'windows-latest' && matrix.native == true
        run: |
          if [ -d "ms-sys" ]; then
            make build-ms-sys || echo "⚠️ ms-sys build failed, continuing without it"
          fi

      - name: Generate version info
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.ref_name }}"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            VERSION="$(git describe --tags --always --dirty)-main"
          else
            VERSION="$(git describe --tags --always --dirty)-${{ github.ref_name }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ env.CGO_ENABLED }}
          CC: ${{ matrix.goarch == 'arm64' && matrix.goos == 'linux' && 'aarch64-linux-gnu-gcc' || '' }}
        shell: bash
        run: |
          LDFLAGS="-s -w -X main.version=${{ steps.version.outputs.version }} -X main.buildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ) -X main.gitCommit=$(git rev-parse HEAD)"
          
          echo "Building for ${{ matrix.goos }}/${{ matrix.goarch }}"
          go build -ldflags "$LDFLAGS" -trimpath -o ember-${{ matrix.suffix }} .
          
          # Verify the binary
          if [ "${{ matrix.native }}" = "true" ]; then
            ./ember-${{ matrix.suffix }} --version || echo "⚠️ Binary verification failed"
          fi

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: ./
          format: spdx-json
          artifact-name: sbom-${{ matrix.suffix }}.spdx.json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: ember-${{ matrix.suffix }}

      - name: Upload binary artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ember-${{ matrix.suffix }}
          path: |
            ember-${{ matrix.suffix }}
            sbom-${{ matrix.suffix }}.spdx.json
          retention-days: 30
          compression-level: 9

  # Benchmark and performance tests
  benchmark:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run benchmarks
        run: |
          go test -bench=. -benchmem -timeout=10m ./... > benchmark.txt || true

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark.txt
          retention-days: 7